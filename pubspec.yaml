name: nitip
description: "Nitip — prototype aplikasi kantin kampus (demo klien)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  animations: ^3.0.0
  audioplayers: ^6.8.1
  confetti: ^0.8.0
  excel: ^4.0.6
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.3.3
  go_router: ^18.1.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sfx/
    - assets/brand/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# Ikon launcher (Customer = oranye). Regenerasi: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon_customer.png
  adaptive_icon_background: "#FF6A2B"
  adaptive_icon_foreground: assets/brand/icon_fg.png
  min_sdk_android: 21

# Splash native. Regenerasi: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/brand/splash_mark.png
  android_12:
    color: "#FFFFFF"
    image: assets/brand/splash_mark.png
  web: false
