# Deploy web prototype ke Vercel (build di GitHub Actions, upload prebuilt).
# Butuh secret: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID. Tanpa secret, job dilewati.
name: Deploy web
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - name: Deploy ke Vercel
        if: env.HAS_TOKEN == 'true'
        run: |
          npm i -g vercel@latest
          mkdir -p .vercel/output/static
          cp -r build/web/. .vercel/output/static/
          cat > .vercel/output/config.json <<'JSON'
          {"version": 3, "routes": [{"handle": "filesystem"}, {"src": "/(.*)", "dest": "/index.html"}]}
          JSON
          vercel deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"
      - name: Tanpa token Vercel
        if: env.HAS_TOKEN != 'true'
        run: echo "VERCEL_TOKEN belum di-set; build web berhasil tapi tidak di-deploy."
